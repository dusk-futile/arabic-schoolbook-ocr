name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m mypy src
      - run: python -m pytest
      - name: Synthetic end-to-end CLI smoke
        run: |
          python scripts/create_demo_fixture.py
          arabic-schoolbook-ocr process examples/demo/source/synthetic_schoolbook.pdf --mode mock --output-dir release-smoke
          test -s release-smoke/output/synthetic_schoolbook_literal.docx
          test -s release-smoke/output/synthetic_schoolbook_polished.docx

  windows:
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build web interface
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build portable ZIP
        shell: powershell
        run: scripts/build_windows_release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/ArabicSchoolbookOCR-v0.1.0-alpha-windows.zip
            dist/SHA256SUMS.txt

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/arabic-schoolbook-ocr
          tags: |
            type=ref,event=tag
            type=raw,value=alpha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    runs-on: ubuntu-latest
    needs: [windows, container]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/ArabicSchoolbookOCR-v0.1.0-alpha-windows.zip
            dist/SHA256SUMS.txt
            INSTALL_WINDOWS.md
            examples/demo/source/synthetic_schoolbook.pdf
            examples/demo/output/demo_literal.docx
            examples/demo/output/demo_polished.docx
            ACCURACY_REPORT.json
            ACCURACY_REPORT.md
            AI_SMOKE_TEST_STATUS.md
            BASELINE_RESULTS.md
            FORMATTING_AUDIT_SUMMARY.md
