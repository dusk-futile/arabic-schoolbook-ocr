name: Keep Streak Alive

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Make multiple commits and push
        run: |
          git config --global user.name "dusk-futile"
          git config --global user.email "287086443+dusk-futile@users.noreply.github.com"
          
          # Create 10 commits to make the contribution graph darker
          for i in {1..10}; do
            echo "Automated commit $i via GitHub Actions: $(date)" >> .commit_streak
            git add .commit_streak
            git commit -m "Automated daily contribution (GitHub Actions): $(date) - commit $i"
          done
          
          git push
