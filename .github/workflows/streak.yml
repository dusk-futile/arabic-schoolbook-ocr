name: Keep Streak Alive

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Make a change
        run: |
          echo "Automated commit via GitHub Actions: $(date)" >> .commit_streak
      
      - name: Commit and push changes
        run: |
          git config --global user.name "dusk-futile"
          git config --global user.email "287086443+dusk-futile@users.noreply.github.com"
          git add .commit_streak
          git commit -m "Automated daily contribution (GitHub Actions): $(date)"
          git push
