[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "arabic-schoolbook-ocr"
version = "0.1.0"
description = "Privacy-first Arabic schoolbook OCR, review, and semantic DOCX reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Arabic Schoolbook OCR contributors" }]
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "Pillow>=10.4,<13",
  "python-docx>=1.1.2,<2",
  "pypdf>=5,<7",
  "pypdfium2>=4.30,<6",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pywin32>=308,<400; platform_system == 'Windows'",
]

[project.optional-dependencies]
azure = ["azure-ai-documentintelligence>=1.0.2,<2"]
gemini = ["google-genai>=1.0,<2"]
local = [
  "paddleocr[doc-parser]>=3.5,<4",
  "numpy>=1.24,<2.4",
  "paddlepaddle==3.2.2; platform_system == 'Windows'",
  "paddlepaddle>=3.2.2,<3.3; platform_system == 'Linux'",
]
dev = [
  "arabic-reshaper>=3.0,<4",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "python-bidi>=0.6,<1",
  "types-Pillow>=10.2",
]

[project.scripts]
arabic-schoolbook-ocr = "arabic_schoolbook_ocr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arabic_schoolbook_ocr"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
packages = ["arabic_schoolbook_ocr"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
