services:
  app:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TRAINING_APPROVED: "false"
      JOB_ROOT: /data/jobs
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      ENABLE_GEMINI_VERIFICATION: ${ENABLE_GEMINI_VERIFICATION:-false}
      ENABLE_GEMINI_FORMATTING: ${ENABLE_GEMINI_FORMATTING:-false}
      ENABLE_GEMINI_VISUAL_QA: ${ENABLE_GEMINI_VISUAL_QA:-false}
      GEMINI_VERIFY_CONFIDENCE_THRESHOLD: ${GEMINI_VERIFY_CONFIDENCE_THRESHOLD:-0.85}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-2}
      GEMINI_MAX_PARALLEL_REQUESTS: ${GEMINI_MAX_PARALLEL_REQUESTS:-4}
    volumes:
      - ocr-jobs:/data/jobs
      - ocr-models:/home/appuser/.paddlex
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  ocr-jobs:
  ocr-models:
